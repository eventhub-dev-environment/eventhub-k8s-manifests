apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: eventhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports:
            - containerPort: 9411
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: eventhub
spec:
  type: ClusterIP
  ports:
    - port: 9411
      targetPort: 9411
      name: http
  selector:
    app: zipkin