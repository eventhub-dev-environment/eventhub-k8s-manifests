apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventhub-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eventhub-dev-environment/eventhub-k8s-manifests.git
    targetRevision: main
    path: infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: eventhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
