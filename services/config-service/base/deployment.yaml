apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
spec:
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: juankxxd/eventhub-config-service
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: eventhub-global-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASS)@mongodb:27017/eventhub_config_db?authSource=admin"
            - name: MONGO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MONGO_ROOT_USER }
            - name: MONGO_ROOT_PASS
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MONGO_ROOT_PASS }
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: GATEWAY_INTERNAL_SECRET }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 15