apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: juankxxd/eventhub-notification-service
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: eventhub-global-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: SPRING_MONGODB_HOST
              value: "mongodb"
            - name: SPRING_MONGODB_PORT
              value: "27017"
            - name: SPRING_MONGODB_DATABASE
              value: "eventhub_notifications_db"
            - name: SPRING_MONGODB_AUTHENTICATION_DATABASE
              value: "admin"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASS)@mongodb:27017/eventhub_notifications_db?authSource=admin"
            - name: SPRING_MONGODB_USERNAME
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MONGO_ROOT_USER }
            - name: SPRING_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MONGO_ROOT_PASS }
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: RABBITMQ_USER }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: RABBITMQ_PASS }
            - name: SPRING_MAIL_HOST
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MAIL_HOST }
            - name: SPRING_MAIL_PORT
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MAIL_PORT }
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MAIL_USERNAME }
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MAIL_PASSWORD }
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: GATEWAY_INTERNAL_SECRET }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15