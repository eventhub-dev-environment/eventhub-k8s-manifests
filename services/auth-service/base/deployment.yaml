apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: juankxxd/eventhub-auth-service
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: eventhub-global-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: GATEWAY_INTERNAL_SECRET }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: JWT_SECRET }
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: NEON_DB_AUTH_URL }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: NEON_DB_USER }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: NEON_DB_PASS }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15