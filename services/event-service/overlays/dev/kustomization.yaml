apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub

# Apunta a la carpeta base del servicio
resources:
  - ../../base

# Sobrescribe dinámicamente el tag de la imagen producida por GitHub Actions
images:
  - name: juankxxd/eventhub-event-service
    newName: juankxxd/eventhub-event-service
    newTag: latest # En producción/CD se reemplazará por el SHA del commit