apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
spec:
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: juankxxd/eventhub-event-service
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: eventhub-global-config
            - configMapRef:
                name: event-service-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: MONGO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MONGO_ROOT_USER }
            - name: MONGO_ROOT_PASS
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: MONGO_ROOT_PASS }
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASS)@mongodb:27017/eventhub_events_db?authSource=admin"
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: GATEWAY_INTERNAL_SECRET }
            - name: AWS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: AWS_ACCESS_KEY_ID }
            - name: AWS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: AWS_SECRET_ACCESS_KEY }
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15