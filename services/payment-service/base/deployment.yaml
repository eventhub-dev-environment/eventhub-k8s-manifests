apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: juankxxd/eventhub-payment-service
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: eventhub-global-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: NEON_DB_PAYMENT_URL }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: NEON_DB_USER }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: NEON_DB_PASS }
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: RABBITMQ_USER }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: eventhub-global-secrets, key: RABBITMQ_PASS }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
